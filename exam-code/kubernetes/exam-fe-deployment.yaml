apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-fe-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam-fe
  template:
    metadata:
      labels:
        app: exam-fe
    spec:
      containers:
      - name: hanil-fe
        image: frenzy669/hanil-fe-repo:latest
        ports:
        - containerPort: 5002

---
apiVersion: v1
kind: Service
metadata:
  name: exam-fe-lb
spec:
  type: NodePort
  selector:
    app: exam-fe-deployment
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
