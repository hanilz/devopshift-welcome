apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: bookinfo-gateway
  namespace: default 
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: bookinfo-httproute
  namespace: default
spec:
  parentRefs:
    - name: bookinfo-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /productpage
      backendRefs:
        - name: productpage
          port: 9080
    - matches:
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: productpage
          port: 9080
    - matches:
        - path:
            type: Exact
            value: /login
      backendRefs:
        - name: productpage
          port: 9080
    - matches:
        - path:
            type: Exact
            value: /logout
      backendRefs:
        - name: productpage
          port: 9080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/products
      backendRefs:
        - name: productpage
          port: 9080